# ros_gz_bridge mappings.
#
# IMPORTANT: this file deliberately does NOT bridge /cmd_vel_requested
# to Gazebo. The diff_drive plugin in rover.gazebo.xacro subscribes to
# the Gazebo topic /cmd_vel_authorized; only ROS-side traffic on that
# same topic name is forwarded. The safety supervisor is the only ROS
# producer that publishes there.
#
# See docs/SAFETY_MODEL.md and docs/adr/ADR-004 for the binding
# rationale.
#
# Direction syntax:
#   GZ_TO_ROS  Gazebo publishes, ROS subscribes.
#   ROS_TO_GZ  ROS publishes,    Gazebo subscribes.
#   BIDIRECTIONAL  both directions.

# Simulator clock for use_sim_time.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Authorized motion: ROS -> Gazebo. The supervisor is the sole producer.
- ros_topic_name: "/cmd_vel_authorized"
  gz_topic_name: "/cmd_vel_authorized"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Wheel-derived odometry: Gazebo -> ROS.
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# 2D LiDAR scan.
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# IMU.
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Contact / bumper.
- ros_topic_name: "/contact"
  gz_topic_name: "/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

# Joint states (wheel encoders).
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# TF.
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
