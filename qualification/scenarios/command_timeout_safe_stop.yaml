# Qualification scenario: command_timeout_safe_stop
#
# When /cmd_vel_requested goes silent past the supervisor's timeout,
# the rover must enter SAFE_STOP and zero authorized motion. Pairs
# with REQ-SAFE-002.

scenario_id: command_timeout_safe_stop
purpose: |
  Verify command-timeout SAFE_STOP semantics: when the supervisor
  stops receiving requested commands, it must enter SAFE_STOP and
  zero authorized motion.

required_topics:
  - /cmd_vel_requested
  - /cmd_vel_authorized
  - /safety/state
  - /safety/events

required_nodes:
  - rover_safety_bridge

required_safety_state: SAFE_STOP

required_events:
  - safety.state.entered
  - safety.command.timeout

forbidden_events:
  - safety.command.non_zero_in_safe_stop

required_replay_artifacts:
  - metadata.json
  - events.jsonl
  - commands.jsonl

qualification_rules:
  - command_path_invariants
  - zero_motion_in_safe_stop

expected_outcome: passed
