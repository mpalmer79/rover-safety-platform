# Qualification scenario: safe_stop_command_zeroing
#
# Verify SAFE_STOP forces every authorized command to zero linear and
# zero angular velocity. Pairs with REQ-SAFE-002.

scenario_id: safe_stop_command_zeroing
purpose: |
  Trigger a SAFE_STOP transition (operator request or sensor stale)
  and verify every published /cmd_vel_authorized between the
  transition and the end of the run carries linear=0 and angular=0.

required_topics:
  - /cmd_vel_requested
  - /cmd_vel_authorized
  - /safety/state
  - /safety/events

required_nodes:
  - rover_safety_bridge

required_safety_state: SAFE_STOP

required_events:
  - safety.state.entered
  - safety.command.zeroed

forbidden_events:
  - safety.command.non_zero_in_safe_stop

required_replay_artifacts:
  - metadata.json
  - events.jsonl
  - commands.jsonl

qualification_rules:
  - command_path_invariants
  - zero_motion_in_safe_stop

expected_outcome: passed
