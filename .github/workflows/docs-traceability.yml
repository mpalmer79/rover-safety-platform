# actions pinned to commit SHAs; update via tools/update-action-pins.sh
# Traceability matrix and verification report freshness check.
#
# Regenerates the traceability matrix and verification report on every
# push, then fails if the regenerated docs differ from the committed
# ones. This keeps docs/TRACEABILITY_MATRIX.md and
# docs/SCENARIO_VERIFICATION_REPORT.md honest.

name: docs-traceability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  traceability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Regenerate traceability matrix
        run: |
          python tools/generate_traceability.py --with-verification

      - name: Regenerate scenario verification report
        run: |
          python tools/generate_verification_report.py

      - name: Detect drift
        run: |
          # The generators stamp ``generated_at_utc`` so a clean
          # regeneration always changes that line. Compare with the
          # timestamp masked so we only fail on real content drift.
          set -euo pipefail
          mask='s/^- \*\*Generated:\*\*.*/- **Generated:** <stamped>/g; s/"generated_at_utc": "[^"]*"/"generated_at_utc": "<stamped>"/g'
          drift=0
          for f in docs/TRACEABILITY_MATRIX.md docs/SCENARIO_VERIFICATION_REPORT.md \
                   verification/traceability.json verification/verification_report.json; do
            if [ ! -f "$f" ]; then
              echo "::error ::$f missing after regeneration"
              drift=1
              continue
            fi
            committed=$(git show "HEAD:$f" 2>/dev/null | sed -E "$mask" || true)
            regenerated=$(sed -E "$mask" "$f")
            if [ "$committed" != "$regenerated" ]; then
              echo "::error ::$f drifted; rerun the generators and commit"
              diff <(echo "$committed") <(echo "$regenerated") | head -50 || true
              drift=1
            fi
          done
          exit "$drift"
