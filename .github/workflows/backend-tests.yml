# Phase-3 + Phase-5 backend tests.
#
# Runs the deterministic backend test suite. No ROS / Gazebo required;
# this job runs on every push and pull request so safety, mission,
# fault-injection, replay, and verification logic regressions are
# caught early.

name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pyyaml

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: Run rover_ws static test suite (no ROS)
        working-directory: rover_ws
        run: python -m pytest tests/ -q
