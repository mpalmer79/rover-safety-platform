# actions pinned to commit SHAs; update via tools/update-action-pins.sh
# Phase-3 + Phase-5 backend tests.
#
# Runs the deterministic backend test suite. No ROS / Gazebo required;
# this job runs on every push and pull request so safety, mission,
# fault-injection, replay, and verification logic regressions are
# caught early.

name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov pytest-randomly pyyaml

      - name: Run backend test suite with coverage (random order)
        working-directory: backend
        # pytest-randomly auto-installs as a plugin; the suite runs
        # in randomised order on every CI invocation. The chosen
        # seed is printed by the plugin so a failure can be
        # reproduced locally via `pytest --randomly-seed=<N>`.
        # See docs/TESTING_STRATEGY.md §15.
        run: |
          python -m pytest tests/ -q \
            -p randomly \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=81

      - name: Enforce per-file coverage on safety modules
        working-directory: backend
        run: |
          # Per-file floors. The global floor is set in pyproject.toml
          # to 81% (observed - 2). These three modules carry the
          # safety-authority claim and have stricter floors:
          #   - app/safety/supervisor.py   observed 89% → pinned 88%
          #   - app/safety/arbitration.py  observed 89% → pinned 88%
          #   - app/safety/transitions.py  observed 100% → pinned 95%
          # supervisor.py + arbitration.py are below the 95% target;
          # see docs/TESTING_STRATEGY.md for the remediation note.
          set -euo pipefail
          python -m coverage report --fail-under=88 \
            --include='app/safety/supervisor.py'
          python -m coverage report --fail-under=88 \
            --include='app/safety/arbitration.py'
          python -m coverage report --fail-under=95 \
            --include='app/safety/transitions.py'

      - name: Upload coverage report artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/

      - name: Run rover_ws static test suite (no ROS)
        working-directory: rover_ws
        run: python -m pytest tests/ -q
