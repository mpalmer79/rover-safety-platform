# Evidence validation: re-run scenario evidence generation and verify
# the resulting per-scenario manifests still pass.
#
# This ensures the deterministic engine + verification pipeline
# regenerates green evidence for every Phase 1C / Phase 2 scenario.

name: evidence-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Generate scenario evidence
        run: |
          python tools/generate_evidence.py \
            --evidence-root /tmp/ci-evidence \
            --runs-root /tmp/ci-runs \
            --output /tmp/ci-evidence/manifest.json

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path('/tmp/ci-evidence/manifest.json').read_text())
          scenarios = manifest.get('scenarios', [])
          if not scenarios:
              print("no scenarios in manifest")
              sys.exit(1)
          failed = [s for s in scenarios if s['status'] != 'passed']
          if failed:
              print(f"failed scenarios: {[s['scenario_id'] for s in failed]}")
              sys.exit(1)
          print(f"all {len(scenarios)} scenarios passed")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-evidence-${{ github.run_id }}
          path: /tmp/ci-evidence/
          retention-days: 14
