# actions pinned to commit SHAs; update via tools/update-action-pins.sh
# Mission Control frontend CI (Phase 17B).
#
# Validates the apps/mission-control workspace on every PR that
# touches the frontend, the verification traceability artefact, or
# the rehearsal / skill audit bundles the UI consumes. Honesty rules
# from Phase 17A/17B are enforced here: a PR that introduces a
# cloud SDK import, a forbidden /cmd_vel publication, or a fake
# bag-backed claim fails this gate.
#
# DO NOT run real LLM models, real network calls, or live ROS
# components from this workflow.

name: mission-control-ci

on:
  pull_request:
    paths:
      - "apps/mission-control/**"
      - "verification/traceability.json"
      - "mission-rehearsals/**"
      - "skill-library/**"
      - "spatial-replay/**"
      - ".github/workflows/mission-control-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mission-control/**"
      - "verification/traceability.json"
      - "mission-rehearsals/**"
      - "skill-library/**"
      - "spatial-replay/**"

permissions:
  contents: read

concurrency:
  group: mission-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Static export + honesty gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mission-control
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python (for replay hydration gate)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Hydrate canonical replay artefacts (Phase 18 gate)
        working-directory: ${{ github.workspace }}
        run: python tools/hydrate_replay_artifacts.py --check-only

      - name: Verify hydration produced no working-tree drift
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- spatial-replay/runs; then
            echo "::error::hydration drifted committed spatial-replay/runs/"
            git --no-pager diff -- spatial-replay/runs
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Vitest with v8 coverage gate
        # Honest floors live in vitest.config.ts. The job fails when
        # any threshold (global or safety-relevant per-file) is
        # crossed. See apps/mission-control/README.md "Coverage
        # gating" for the pinned values + remediation notes.
        run: npm run test

      - name: Surface a11y violations distinctly
        # jest-axe failures already failed the vitest run above; this
        # step re-runs ONLY the a11y suite and labels its output so
        # the CI log makes accessibility regressions easy to spot.
        if: failure()
        run: |
          echo "::group::accessibility (jest-axe) report"
          npx vitest run tests/a11y.test.tsx --reporter=verbose || true
          echo "::endgroup::"

      - name: Upload frontend coverage artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission-control-coverage
          path: apps/mission-control/coverage/

      - name: Next.js static export build
        run: npm run build

      - name: Verify SafetyBoundaryBanner renders on every page
        run: |
          # The build prerenders every route into .next/server/app/.
          # The footer of every page must contain the verbatim
          # "Simulation-only" disclaimer; the safety banner is in
          # the root layout, so every prerendered HTML carries it.
          set -euo pipefail
          missing=0
          for file in $(find .next/server/app -name "*.html"); do
            if ! grep -q "Simulation-only" "$file"; then
              echo "::error file=$file::missing Simulation-only banner"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi

      - name: Verify no bag-backed claim sneaks into the static export
        run: |
          # The Phase 13 honesty rule: bag-backed = false unless real
          # bag artefacts exist. Every committed rehearsal audit is
          # simulation-only, so the prerendered HTML must NEVER
          # contain ``bag-backed: yes``.
          set -euo pipefail
          if grep -RIn "bag-backed: yes" .next/server/app; then
            echo "::error::static export contains a bag-backed=yes claim"
            exit 1
          fi

      - name: Verify spatial-replay artefacts are internally honest
        working-directory: ${{ github.workspace }}
        run: |
          # Phase 17C honesty rule: every committed
          # spatial-replay artefact must declare a derivation_source
          # consistent with its bag_status. The check fails on:
          #
          #   * derivation_source=bag_backed with bag_status != bag_backed
          #   * derivation_source=bag_backed with sample_count == 0
          #   * derivation_source=fixture with bag_status == bag_backed
          #
          # The rule is enforced here in addition to the unit tests so
          # that a manually-edited artefact cannot bypass the gate.
          set -euo pipefail
          shopt -s nullglob
          if [ -d spatial-replay/runs ]; then
            python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          errors = []
          for run_dir in sorted(Path("spatial-replay/runs").iterdir()):
              artefact = run_dir / "spatial-replay.json"
              if not artefact.exists():
                  continue
              data = json.loads(artefact.read_text())
              ds = data.get("derivation_source")
              bs = data.get("bag_status")
              sc = data.get("sample_count", 0)
              if ds == "bag_backed":
                  if bs != "bag_backed":
                      errors.append(
                          f"{artefact}: derivation_source=bag_backed but "
                          f"bag_status={bs!r}"
                      )
                  if sc == 0:
                      errors.append(
                          f"{artefact}: derivation_source=bag_backed but "
                          f"sample_count=0"
                      )
              if ds == "fixture" and bs == "bag_backed":
                  errors.append(
                      f"{artefact}: derivation_source=fixture but "
                      f"bag_status=bag_backed"
                  )
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          PY
          fi

      - name: Verify the prerendered HTML never claims bag-backed for a fixture
        run: |
          # The static export must not contain "Spatial source: bag-backed runtime evidence"
          # for any mission whose committed spatial-replay artefact is fixture-derived.
          # Cross-check the two: list every PRERENDERED HTML page that mentions
          # the bag-backed caption, and ensure each corresponds to an artefact
          # that validates. We deliberately scope the grep to .html files only;
          # the .js bundle naturally contains the literal switch-statement
          # string from describeDerivationSource which is not a render claim.
          #
          # The /catalog route (Item 5) is explicitly excluded: the
          # catalog renders <SpatialReplayBadge source="bag_backed" />
          # as a documented state-VARIANT demo. The catalog never
          # asserts that any specific run IS bag-backed; it shows
          # what the badge looks like in each derivation_source.
          set -euo pipefail
          claims=$(find .next/server/app -name '*.html' \
            -not -path '*/catalog.html' \
            -not -path '*/__visual__.html' \
            -print0 | xargs -0 grep -ln "bag-backed runtime evidence" || true)
          if [ -n "$claims" ]; then
            echo "Pages claiming bag-backed runtime evidence:"
            echo "$claims"
            # Cross-check at least one committed artefact validates.
            python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          runs_root = Path("../../spatial-replay/runs")
          # If no artefact has bag_backed status, any claim is fake.
          any_bag_backed = False
          if runs_root.exists():
              for run_dir in runs_root.iterdir():
                  art = run_dir / "spatial-replay.json"
                  if art.exists():
                      data = json.loads(art.read_text())
                      if (
                          data.get("derivation_source") == "bag_backed"
                          and data.get("bag_status") == "bag_backed"
                          and data.get("sample_count", 0) > 0
                      ):
                          any_bag_backed = True
                          break
          if not any_bag_backed:
              print(
                  "::error::prerendered HTML mentions 'bag-backed runtime "
                  "evidence' but no spatial-replay artefact validates"
              )
              sys.exit(1)
          PY
          fi

  visual-regression:
    name: Playwright visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Auto-skipping until baselines are bootstrapped.
    #
    # ``visual/__screenshots__/`` is empty in this repo, so a naive
    # ``npx playwright test`` invocation fails every PR on
    # "snapshot doesn't exist". A required CI check that's always
    # red trains the team to ignore CI.
    #
    # Instead, this job detects whether any baseline PNGs are
    # committed. If none are, it emits a notice and exits cleanly
    # — no browser download, no build, no spurious failure. The
    # moment an operator runs the bootstrap (see
    # ``docs/VISUALIZATION_ROADMAP.md``) and commits PNGs under
    # ``visual/__screenshots__/``, this job automatically becomes
    # a hard gate against visual drift.
    defaults:
      run:
        working-directory: apps/mission-control
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Detect committed visual baselines
        id: baselines
        run: |
          if compgen -G "visual/__screenshots__/**/*.png" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Visual baselines present — running Playwright drift gate."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No visual baselines committed under visual/__screenshots__/. Skipping Playwright visual regression. See docs/VISUALIZATION_ROADMAP.md for the bootstrap procedure."
          fi

      - name: Set up Node.js 22
        if: steps.baselines.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install dependencies
        if: steps.baselines.outputs.present == 'true'
        run: npm ci

      - name: Install Playwright Chromium (browser only; no apt deps)
        if: steps.baselines.outputs.present == 'true'
        # `--with-deps` requires sudo apt-get on the runner. The
        # GitHub-hosted ubuntu-24.04 image already has the system
        # libraries Playwright needs for Chromium, so we install
        # the browser binary only.
        run: npx playwright install chromium

      - name: Build the static export
        if: steps.baselines.outputs.present == 'true'
        run: npm run build

      - name: Run visual regression
        if: steps.baselines.outputs.present == 'true'
        # With baselines present this is a real drift gate. An
        # intentional UI change requires re-running
        # ``npx playwright test --update-snapshots`` locally and
        # committing the updated PNGs.
        run: npx playwright test

      - name: Upload Playwright report + screenshots
        if: always() && steps.baselines.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission-control-visual-regression
          path: |
            apps/mission-control/visual/playwright-report/
            apps/mission-control/visual/__screenshots__/
            apps/mission-control/visual/test-results/

  bundle-budget:
    name: Per-route bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mission-control
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the static export
        run: npm run build

      - name: Enforce per-route bundle budgets
        # Budgets live in apps/mission-control/scripts/bundle-budgets.json.
        # The check exits non-zero when any route's gzipped first-load
        # JS exceeds its budget. Raising a budget is a deliberate edit.
        run: npm run bundle:check

      - name: Upload bundle-analyzer report (only when ANALYZE=true)
        if: env.ANALYZE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mission-control-bundle-analyze
          path: apps/mission-control/.next/analyze/
